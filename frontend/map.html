<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Map - Chemnitz Cultural Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #map {
      height: calc(100vh - 90px);
      width: 100vw;
      z-index: 1;
      position: relative;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background-color: #222;
      color: white;
    }
    .left-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .right-group {
      position: relative;
      display: flex;
      align-items: center;
    }
    .user-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 40px;
      background: white;
      color: black;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      min-width: 200px;
      z-index: 9999;
    }
    .footer {
      background: #111;
      color: #eee;
      text-align: center;
      padding: 11.2px;
      font-size: 0.9em;
    }
    .dropdown {
      position: relative;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      top: 35px;
      background-color: black;
      color: white;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 999;
      border-radius: 5px;
    }
    .dropdown-content button {
      background: none;
      border: none;
      padding: 10px;
      width: 100%;
      text-align: left;
      color: white;
      cursor: pointer;
    }
    .dropdown-content button:hover {
      background-color: rgb(214, 68, 14);
    }

    @keyframes bounceFade {
      0%   { transform: scale(1); opacity: 1; }
      50%  { transform: scale(1.4); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }

    .heart-bounce {
      animation: bounceFade 0.4s ease;
    }

    .bounce-favorite {
      animation: bounceFade 0.4s ease;
      animation-fill-mode: forwards;
    }

  #favoritesPanel {
  position: absolute;
  top: 50px; /* aligns with header height */
  left: 0;
  width: 300px;
  height: calc(100vh - 90px);
  background: #222;
  color: white;
  border-radius: 0 8px 8px 0;
  box-shadow: 2px 0 6px rgba(0,0,0,0.3);
  padding: 15px;
  z-index: 999;
  overflow-y: auto;
}

#favoritesPanel h4 {
  font-size: 18px;
  margin-bottom: 12px;
  color: rgb(214, 68, 14);
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 6px;
}

#favoritesList li {
  background: #222;
  margin-bottom: 8px;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #333;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.3s ease;
}

#favoritesList li:hover {
  background: #2c2c2c;
}

#favoritesList li button {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0;
}

#favoritesList li button i {
  color: red;
  font-size: 16px;
}
.panel-close-btn {
  position: absolute;
  top: 8px;
  right: 10px;
  background: transparent;
  color: white;
  border: none;
  font-size: 20px;
  cursor: pointer;
  z-index: 9999;
}

.panel-close-btn:hover {
  color: red;
}

.results-table {
  position: absolute;
  top: 50px;
  right: 0;
  width: 460px;
  max-height: calc(100vh - 90px);
  background-color: #222;
  color: white;
  border-radius: 8px 0 0 8px;
  padding: 15px;
  box-shadow: -2px 0 6px rgba(0,0,0,0.3);
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 1001; 
}


    .results-table table {
      width: 100%;
      table-layout: fixed;
    }  

    .results-table th {
      background: rgb(214, 68, 14);
      color: white;
      padding: 8px;
      text-align: left;
      word-wrap: break-word;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;   
    }

    .results-table td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #444;
      cursor: pointer;
      word-wrap: break-word;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .results-table tr:hover {
      background-color: #333;
    }
    
    @keyframes markerBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.5); }
    }   

    .bounce-marker {
      animation: markerBounce 1s ease;
    }

  </style>
</head>
<body>

<header>
  <div class="left-group">
    <span id="welcomeMessage" style="font-weight: bold;"></span>
    <input type="text" id="searchInput" placeholder="Search places..." style="padding: 6px 10px; border-radius: 4px; border: none; width: 200px;">
    <button id="locateBtn" style="padding: 6px 10px; background:  rgb(214, 68, 14); color: white; border: none; border-radius: 4px; cursor: pointer;">My Location</button>
    <div class="dropdown">
      <button style="padding: 6px 10px; background: #444; color: white; border: none; border-radius: 4px; cursor: pointer;">Categories</button>
      <div class="dropdown-content">
        <button onclick="filterCategory('all')">All</button>
        <button onclick="filterCategory('museum')">Museums</button>
        <button onclick="filterCategory('restaurant')">Restaurants</button>
        <button onclick="filterCategory('theatre')">Theatres</button>
        <button onclick="filterCategory('artwork')">Artworks</button> 
        <button onclick="filterCategory('hotel')">Hotels</button>
        <button onclick="filterCategory('guest_house')">Guest Houses</button>
        <button onclick="filterCategory('gallery')">Galleries</button>
      </div>
    </div>
    <button class="btn" onclick="toggleResultsTable()" style="padding: 6px 10px; background: #444; color: white; border: none; border-radius: 4px; cursor: pointer;">All Places</button>
    <button id="toggleFavorites" style="padding: 6px 10px; background: #444; color: white; border: none; border-radius: 4px; cursor: pointer;">
      My List <span style="color:red">❤</span>
    </button>
  </div>
  <div class="right-group">
    <button onclick="toggleUserDropdown()" style="background: none; border: none; color: white; cursor: pointer; font-size: 20px;">
      <i class="fas fa-user-circle"></i>
    </button>
    <div id="userDropdown" class="user-dropdown">
      <p id="userName"><strong></strong></p>
      <p id="userEmail"><strong></strong></p>
      <button onclick="logout()" style="margin-top: 10px; background: red; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; width: 100%;">Logout</button>
    </div>
  </div>
</header>

<div id="map"></div>
<div id="favoritesPanel" style="display: none;">
  <button class="panel-close-btn" onclick="document.getElementById('favoritesPanel').style.display='none'">×</button>
  <h4 style="margin: 0 0 10px; font-size: 18px;">❤️ Favorite Places</h4>
  <ul id="favoritesList" style="list-style: none; padding: 0; margin: 0;"></ul>
</div>
<div id="resultsTable" class="results-table" style="display: none;">
  <button class="panel-close-btn" onclick="document.getElementById('resultsTable').style.display='none'">×</button>
  <h3>All Places</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Latitude</th>
        <th>Longitude</th>
      </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
  </table>
</div>

<div id="toast" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  background-color: rgba(0,0,0,0.85);
  color: white;
  padding: 10px 20px;
  border-radius: 6px;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 9999;
  pointer-events: none;
"></div>



<footer class="footer">&copy; 2025 Chemnitz Cultural Map | Contact: info@chemnitzmap.de</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  const token = localStorage.getItem("token");
  const map = L.map('map', {
    zoomControl: false
  }).setView([50.8323, 12.9253], 13);

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  let geojsonData = null;
  const markerMap = {};
  let allMarkers = [];

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  
 const markerIcons = {
  default: new L.Icon.Default(),
  museum: new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  }),
  restaurant: new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  }),
  theatre: new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-yellow.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  }),
  artwork: new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  }),
  hotel: new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-violet.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  }),
  guest_house: new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-grey.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  }),
  gallery: new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  })
};
    markerIcons.guesthouse = markerIcons.guest_house;
    markerIcons.art_gallery = markerIcons.gallery;

  fetch('./dbwProjectOfflineData/Chemnitz.geojson')
    .then(res => res.json())
    .then(data => {
      geojsonData = data;
      renderGeoJson(data);
    })
    .catch(err => console.error('Error loading GeoJSON:', err));


  function renderGeoJson(data, filter = 'all') {
    allMarkers.forEach(m => map.removeLayer(m));
    allMarkers = [];

    L.geoJSON(data, {
      filter: (feature) => {
        if (filter === 'all') return true;
        const props = feature.properties;
        return (
            props.tourism === filter || 
            props.amenity === filter || 
            props.leisure === filter ||
            (filter === 'art_gallery' && props.art_gallery === 'yes') 
        );
      },
      pointToLayer: (feature, latlng) => {
        const props = feature.properties;
        const categoryRaw =
          props.tourism || props.amenity || props.leisure || 
          (props.art_gallery === "yes" && "gallery") || "";

        const category = categoryRaw
         .toLowerCase()
         .replace(/\s+/g, "_")
         .trim();
        const icon = markerIcons[category] || markerIcons.default;
        return L.marker(latlng, { icon });
    },
    onEachFeature: (feature, layer) => {

        const name = feature.properties.name || 'Unnamed';
        const category = feature.properties.tourism || feature.properties.amenity || feature.properties.leisure || (feature.properties.art_gallery === "yes" ? "Art Gallery" : "Other");
        layer.bindPopup(`
          <strong>${name}</strong><br/>
          <em>Category: ${category}</em><br/>
          <button class="favorite-btn" onclick='addToFavorites(${JSON.stringify(feature).replace(/'/g, "\\'")}, this)'>❤️ Favorite</button>
        `);


        layer.bindTooltip(name, { permanent: false, direction: "top" });
        markerMap[name] = layer;
        allMarkers.push(layer);
      }
      }).addTo(map);
    }

        
  function filterCategory(category) {
    console.log("Filtering by:", category);
    if (geojsonData) renderGeoJson(geojsonData, category);
  }

  function toggleUserDropdown() {
    const dropdown = document.getElementById("userDropdown");
    dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
  }

  function logout() {
    localStorage.removeItem("token");
    window.location.href = "index.html";
  }
    window.addEventListener("DOMContentLoaded", () => {
      loadFavorites();  
    });

  document.getElementById("toggleFavorites").addEventListener("click", () => {
    const panel = document.getElementById("favoritesPanel");
    const isVisible = panel.style.display === "block";
    panel.style.display = isVisible ? "none" : "block";

    if (!isVisible) {
       loadFavorites(); 
    }
  });
    const dropdownBtn = document.querySelector(".dropdown > button");
    const dropdownContent = document.querySelector(".dropdown-content");

    dropdownBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const isVisible = dropdownContent.style.display === "block";
      dropdownContent.style.display = isVisible ? "none" : "block";
    });

    document.addEventListener("click", () => {
      dropdownContent.style.display = "none";
    });

  fetch("http://localhost:5000/api/auth/me", {
    headers: { Authorization: "Bearer " + token }
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("userName").innerText = `Name: ${data.user.name}`;
    document.getElementById("userEmail").innerText = `Email: ${data.user.email}`;
    document.getElementById("welcomeMessage").textContent = `Welcome, ${data.user.name}!`;
  })
  .catch(err => {
    console.error("Auth failed", err);
    localStorage.removeItem("token");
    window.location.href = "index.html";
  });

  async function addToFavorites(site, btnElement) {
    if (!token) return alert("Please log in first.");
    try {
      const res = await fetch("http://localhost:5000/api/auth/favorites", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({ site })
      });
      const result = await res.json();
      showToast(result.message || "Saved to favorites!");

      btnElement.classList.remove("bounce-favorite");
      void btnElement.offsetWidth; // Force reflow
      btnElement.classList.add("bounce-favorite");

       loadFavorites(); 
    } catch (err) {
      alert("Error saving favorite.");
      console.error(err);
    }
  }
  
  function showToast(message, duration = 2000) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.style.opacity = 1;
    setTimeout(() => {
      toast.style.opacity = 0;
    }, duration);
  }

  async function removeFavorite(lng, lat) {
    if (!token) return alert("Please log in first.");
    try {
      const res = await fetch("http://localhost:5000/api/auth/favorites", {
        method: "DELETE",
        headers: {
          "Content-Type": "application/json",
           Authorization: "Bearer " + token
        },
        body: JSON.stringify({ lng, lat })
     });

      const result = await res.json();
      loadFavorites(); // Refresh list
    } catch (err) {
      alert("Error removing favorite.");
      console.error(err);
    }
}

 let userLocationMarker = null;

document.getElementById("locateBtn").addEventListener("click", () => {
  const locateBtn = document.getElementById("locateBtn");
  
  if (navigator.geolocation) {
    // START: Show loading effect
    locateBtn.disabled = true;
    locateBtn.style.opacity = "0.6";
    locateBtn.textContent = "Locating...";

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;

        if (userLocationMarker) {
          map.removeLayer(userLocationMarker);
        }

        const redIcon = new L.Icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
          shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
        });

        userLocationMarker = L.marker([latitude, longitude], { icon: redIcon })
          .addTo(map)
          .bindPopup("You are here")
          .openPopup();

        map.setView([latitude, longitude], 14);

        // END: Reset button after location shown
        locateBtn.disabled = false;
        locateBtn.style.opacity = "1";
        locateBtn.textContent = "My Location";
      },
      () => {
        alert("Unable to retrieve your location.");
        locateBtn.disabled = false;
        locateBtn.style.opacity = "1";
        locateBtn.textContent = "My Location";
      }
    );
  } else {
    alert("Geolocation not supported.");
  }
});

     async function loadFavorites() {
  try {
    const res = await fetch("http://localhost:5000/api/auth/favorites", {
      headers: {
        Authorization: "Bearer " + token
      }
    });
    const result = await res.json();
    const list = document.getElementById("favoritesList");
    list.innerHTML = "";

    if (result.favorites.length === 0) {
      const li = document.createElement("li");
      li.textContent = "No favorites yet.";
      li.style.color = "#888";
      list.appendChild(li);
      return; 
    }

    result.favorites.forEach(fav => {
      const li = document.createElement("li");
      li.style.cursor = "pointer";
      li.style.padding = "5px 0";
      li.style.display = "flex";
      li.style.justifyContent = "space-between";
      li.style.alignItems = "center";

      li.innerHTML = `
        <span>${fav.properties.name || "Unnamed"}</span>
        <button onclick="event.stopPropagation(); removeFavorite(${fav.geometry.coordinates[0]}, ${fav.geometry.coordinates[1]})"
           style="background-color: transparent; border: none; cursor: pointer;">
           <i class="fas fa-trash-alt" style="color: red; font-size: 16px;"></i>
        </button>
     `;

     li.onclick = () => {
       const coords = fav.geometry.coordinates;
       const latlng = [coords[1], coords[0]];
       map.setView(latlng, 16);
       if (markerMap[fav.properties.name]) {
         markerMap[fav.properties.name].openPopup();
        }
      };
      list.appendChild(li);
    });    
  } catch (err) {
    console.error("Error loading favorites:", err);
  }
}

// Search on input
document.getElementById("searchInput").addEventListener("input", function () {
  const query = this.value.toLowerCase();

  if (!query) {
    renderGeoJson(geojsonData); // show all
    return;
  }

  allMarkers.forEach(marker => {
    const name = marker.feature?.properties?.name?.toLowerCase() || "";
    if (name.includes(query)) {
      marker.addTo(map);
    } else {
      map.removeLayer(marker);
    }
  });
});

document.getElementById("searchInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    e.preventDefault();
    this.blur();  
  }
});

  function toggleResultsTable() {
    const table = document.getElementById("resultsTable");
    const isVisible = table.style.display === "block";
    table.style.display = isVisible ? "none" : "block";
    if (!isVisible) {
    loadOfflineData(); 
  }
}

  async function loadOfflineData() {
  try {
    const res = await fetch("./dbwProjectOfflineData/Chemnitz.geojson");
    const geoData = await res.json();

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = ""; 

    geoData.features.forEach(feature => {
      const name = feature.properties.name || "Unnamed";
      const category = feature.properties.tourism || feature.properties.amenity || feature.properties.leisure || "Other";
      const lat = feature.geometry.coordinates[1];
      const lng = feature.geometry.coordinates[0];

      const row = document.createElement("tr");
      row.innerHTML = `
        <td style="color: rgb(214, 68, 14); text-decoration: underline;">${name}</td>
        <td>${category}</td>
        <td>${lat.toFixed(5)}</td>
        <td>${lng.toFixed(5)}</td>
      `;

      row.addEventListener("click", () => {
        map.setView([lat, lng], 16);
        const marker = markerMap[name];
        if (marker) {
          marker.openPopup();

          const markerEl = marker._icon;
          if (markerEl) {
            markerEl.classList.add("bounce-marker");
            setTimeout(() => {
              markerEl.classList.remove("bounce-marker");
            }, 1000);
          }
        }
      });

      tbody.appendChild(row); 
    });

  } catch (err) {
    console.error("Error loading offline data:", err);
  }
}

  document.addEventListener("DOMContentLoaded", loadOfflineData);

</script>
</body>
</html>
